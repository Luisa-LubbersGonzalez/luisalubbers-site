<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Form</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-00WMN0SCYM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-00WMN0SCYM');
    </script>
    <script src="https://cdn.logr-in.com/LogRocket.min.js" crossorigin="anonymous"></script>
    <script>window.LogRocket && window.LogRocket.init('gpzzye/luisalubberssite');</script>
</head>
<body>

  <h1>Echo Form Demo</h1>

  <div id="no-js-fallback">
    <p>Basic mode (JavaScript disabled or unavailable) — pick a language below:</p>

    <h3>PHP</h3>
    <form method="POST" action="/cgi-bin/echo-PHP.php">
      <input type="text" name="name" placeholder="Enter a name">
      <input type="text" name="message" placeholder="Enter a message">
      <button type="submit">Send (POST)</button>
    </form>

    <h3>Perl</h3>
    <form method="POST" action="/cgi-bin/perl-general-echo.pl">
      <input type="text" name="name" placeholder="Enter a name">
      <input type="text" name="message" placeholder="Enter a message">
      <button type="submit">Send (POST)</button>
    </form>

    <h3>Python</h3>
    <form method="POST" action="/cgi-bin/echo-Python.py">
      <input type="text" name="name" placeholder="Enter a name">
      <input type="text" name="message" placeholder="Enter a message">
      <button type="submit">Send (POST)</button>
    </form>
  </div>

  <div id="js-enhanced" style="display:none;">
    <p>Enhanced mode (JavaScript enabled) — full control over language, method, and encoding:</p>

    <form id="echo-form">
      <label>Language:
        <select id="language-select">
          <option value="php">PHP</option>
          <option value="perl">Perl</option>
          <option value="python">Python</option>
          <option value="node">Node.js</option>
        </select>
      </label>

      <label>Method:
        <select id="method-select">
          <option value="GET">GET</option>
          <option value="POST">POST</option>
          <option value="PUT">PUT</option>
          <option value="DELETE">DELETE</option>
        </select>
      </label>

      <label>Encoding:
        <select id="encoding-select">
          <option value="application/x-www-form-urlencoded">x-www-form-urlencoded</option>
          <option value="application/json">application/json</option>
        </select>
      </label>

      <label>Name: <input type="text" name="name"></label>
      <label>Message: <input type="text" name="message"></label>

      <button type="submit">Send</button>
    </form>

    <h3>Response:</h3>
    <div id="response-output"></div>
  </div>

  <script>
    document.getElementById('no-js-fallback').style.display = 'none';
    document.getElementById('js-enhanced').style.display = 'block';

    document.getElementById('echo-form').addEventListener('submit', function(event) {
        event.preventDefault();

        const language = document.getElementById('language-select').value;
        const method = document.getElementById('method-select').value.toUpperCase();
        const encoding = document.getElementById('encoding-select').value;
        const name = document.querySelector('#echo-form input[name="name"]').value;
        const message = document.querySelector('#echo-form input[name="message"]').value;

        const endpoints = {
            php: '/cgi-bin/echo-PHP.php',
            perl: '/cgi-bin/perl-general-echo.pl',
            python: '/cgi-bin/echo-Python.py',
            node: '/node/echo-NodeJS'
        };

        let url = endpoints[language];
        const fetchOptions = { method: method };

        if (method === 'GET' || method === 'HEAD') {
            const params = new URLSearchParams({ name: name, message: message });
            url = url + '?' + params.toString();
        } else {
            fetchOptions.headers = { 'Content-Type': encoding };
            if (encoding === 'application/json') {
                fetchOptions.body = JSON.stringify({ name: name, message: message });
            } else {
                fetchOptions.body = new URLSearchParams({ name: name, message: message }).toString();
            }
        }

        fetch(url, fetchOptions)
            .then(response => response.text())
            .then(data => {
                document.getElementById('response-output').innerHTML = data;
            })
            .catch(error => {
                document.getElementById('response-output').textContent = 'Error: ' + error;
            });
    });
  </script>

</body>
</html>
